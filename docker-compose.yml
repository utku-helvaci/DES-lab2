# docker-compose.yml - two "computers" on one virtual LAN for Lab 2.
#
#   machine-a   172.28.10.10   runs tcpClient (Machine A, sends first)
#   machine-b   172.28.10.20   runs tcpServer (Machine B, port 9000)
#   sniffer     host network   tcpdump on the LAN bridge des-lan0 (optional)
#
# Each container has its own hostname, network interface (eth0), MAC and IP
# address, routing table, process list and file system: from the programs'
# point of view they are two separate hosts on the same Ethernet segment.
#
#   docker compose up -d --build                      start both machines
#   docker exec -it machine-b tcpServer               terminal 1
#   docker exec -it machine-a tcpClient -s 172.28.10.20   terminal 2
#   docker compose --profile capture up sniffer       terminal 3 (optional)
#   docker compose down                               stop everything
name: des-lab2

services:
  machine-a:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: des-lab2:latest
    container_name: machine-a
    hostname: machine-a
    environment:
      DES_KEY: "0f1571c947d9e859"   # pre-shared secret: the same on both machines
    networks:
      des_lan:
        ipv4_address: 172.28.10.10
    stdin_open: true
    tty: true
    init: true

  machine-b:
    image: des-lab2:latest
    pull_policy: never
    container_name: machine-b
    hostname: machine-b
    environment:
      DES_KEY: "0f1571c947d9e859"
    networks:
      des_lan:
        ipv4_address: 172.28.10.20
    stdin_open: true
    tty: true
    init: true
    depends_on:
      - machine-a

  # Listens on the bridge that connects the two machines (like a mirror port
  # on a switch) and prints every packet of the conversation.
  sniffer:
    image: des-lab2:latest
    pull_policy: never
    container_name: des-sniffer
    profiles: ["capture"]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    command: ["tcpdump", "-i", "des-lan0", "-nn", "-l", "-A", "tcp port 9000"]

networks:
  des_lan:
    name: des_lan
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: des-lan0
    ipam:
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1
